name: smart_teacher_dz
description: Smart Teacher DZ - Offline-first grade sheet OCR, verification & Ministry Excel export for Algerian teachers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Local Offline-First Database (SQLite via Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Ministry Excel (.xlsx) Read/Write preserving structure
  excel: ^4.0.3
  file_picker: ^8.0.3
  share_plus: ^9.0.0

  # Camera, Image Handling & Real On-Device ML Kit OCR
  image_picker: ^1.1.2
  image: ^4.2.0
  google_mlkit_text_recognition: any

  # PDF Generation (for Bilan Trimestriel & Student Reports)
  pdf: ^3.11.0
  printing: ^5.13.1

  # Networking (for optional Cloud Vision OCR with explicit teacher consent)
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
