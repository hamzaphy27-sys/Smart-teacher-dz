name: Build Smart Teacher DZ Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build SMART_TEACHER_DZ.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files & fix Offset getter
        run: |
          unzip -o SMART_TEACHER_DZ_CLOUD_READY.zip
          cp -r smart_teacher_dz_app/* .
          sed -i 's/\.center\.x/.center.dx/g' lib/data/services/ocr_provider.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle Wrapper
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          flutter create . --platforms=android --project-name smart_teacher_dz --org dz.smartteacher
          rm -f test/widget_test.dart
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/app_build.gradle.bak android/app/build.gradle

      - name: Install dependencies & generate Drift DB
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run automated tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and publish APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SMART_TEACHER_DZ.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smart Teacher DZ v1.0.${{ github.run_number }}
          files: SMART_TEACHER_DZ.apk
