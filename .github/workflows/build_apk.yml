name: Build Smart Teacher DZ Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build SMART_TEACHER_DZ.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files & apply comprehensive fixes
        run: |
          unzip -o SMART_TEACHER_DZ_CLOUD_READY.zip
          cp -r smart_teacher_dz_app/* .
          rm -f lib/data/local/*.g.dart
          python3 -c '
          import glob

          # 1. Fix Offset.center.dx in ocr_provider.dart
          p_ocr = "lib/data/services/ocr_provider.dart"
          open(p_ocr, "w").write(open(p_ocr).read().replace(".center.x", ".center.dx"))

          # 2. Rename Classes table -> SchoolClasses with explicit @DataClassName("ClassRoom")
          p_tbl = "lib/data/local/tables/app_tables.dart"
          s = open(p_tbl).read()
          s = s.replace("class Classes extends Table", "@DataClassName(\"ClassRoom\")\nclass SchoolClasses extends Table")
          s = s.replace("references(Classes,", "references(SchoolClasses,")
          open(p_tbl, "w").write(s)

          # 3. Update all references across lib/ and test/ cleanly
          for path in glob.glob("lib/**/*.dart", recursive=True) + glob.glob("test/**/*.dart", recursive=True):
              txt = open(path).read()
              txt = txt.replace("ClassesCompanion", "SchoolClassesCompanion")
              txt = txt.replace("tables: [TeacherProfiles, Classes,", "tables: [TeacherProfiles, SchoolClasses,")
              txt = txt.replace("select(classes)", "select(schoolClasses)")
              txt = txt.replace("into(classes)", "into(schoolClasses)")
              txt = txt.replace("delete(classes)", "delete(schoolClasses)")
              txt = txt.replace("Clazz", "ClassRoom")
              open(path, "w").write(txt)

          # 4. Ensure ocr_provider import exists in domain_safety_test.dart
          p_test = "test/domain_safety_test.dart"
          t = open(p_test).read()
          imp = "import '\''package:smart_teacher_dz/data/services/ocr_provider.dart'\'';\n"
          if imp not in t:
              t = imp + t
          open(p_test, "w").write(t)
          '

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle Wrapper
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          flutter create . --platforms=android --project-name smart_teacher_dz --org dz.smartteacher
          rm -f test/widget_test.dart
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/app_build.gradle.bak android/app/build.gradle

      - name: Install dependencies & generate Drift DB
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run automated tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and publish APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SMART_TEACHER_DZ.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smart Teacher DZ v1.0.${{ github.run_number }}
          files: SMART_TEACHER_DZ.apk
