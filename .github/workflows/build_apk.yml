name: Build Smart Teacher DZ Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build SMART_TEACHER_DZ.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files & apply automatic fixes
        run: |
          unzip -o SMART_TEACHER_DZ_CLOUD_READY.zip
          cp -r smart_teacher_dz_app/* .
          sed -i 's/\.center\.x/.center.dx/g' lib/data/services/ocr_provider.dart
          sed -i 's/class Classes extends Table/class SchoolClasses extends Table/g' lib/data/local/tables/app_tables.dart
          sed -i 's/references(Classes,/references(SchoolClasses,/g' lib/data/local/tables/app_tables.dart
          sed -i 's/tables: \[TeacherProfiles, Classes,/tables: [TeacherProfiles, SchoolClasses,/g' lib/data/local/app_database.dart
          sed -i 's/Future<List<Clazz>>/Future<List<SchoolClasse>>/g' lib/data/local/app_database.dart
          sed -i 's/Stream<List<Clazz>>/Stream<List<SchoolClasse>>/g' lib/data/local/app_database.dart
          sed -i 's/Future<Clazz?>/Future<SchoolClasse?>/g' lib/data/local/app_database.dart
          sed -i 's/select(classes)/select(schoolClasses)/g' lib/data/local/app_database.dart
          sed -i 's/into(classes)/into(schoolClasses)/g' lib/data/local/app_database.dart
          sed -i 's/delete(classes)/delete(schoolClasses)/g' lib/data/local/app_database.dart
          sed -i 's/ClassesCompanion/SchoolClassesCompanion/g' lib/data/local/app_database.dart lib/data/repositories/classroom_repository.dart lib/data/services/backup_service.dart test/domain_safety_test.dart
          sed -i 's/Stream<List<Clazz>>/Stream<List<SchoolClasse>>/g' lib/data/repositories/classroom_repository.dart
          sed -i 's/List<Clazz>/List<SchoolClasse>/g' lib/features/home/home_screen.dart
          sed -i 's/final Clazz clazz;/final SchoolClasse clazz;/g' lib/features/classes/class_detail_screen.dart lib/features/reports/bilan_trimestriel_screen.dart lib/features/scan/scan_screen.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle Wrapper
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          flutter create . --platforms=android --project-name smart_teacher_dz --org dz.smartteacher
          rm -f test/widget_test.dart
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/app_build.gradle.bak android/app/build.gradle

      - name: Install dependencies & generate Drift DB
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run automated tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and publish APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SMART_TEACHER_DZ.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smart Teacher DZ v1.0.${{ github.run_number }}
          files: SMART_TEACHER_DZ.apk
